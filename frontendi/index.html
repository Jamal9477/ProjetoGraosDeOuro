<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Frontendi</title>
</head>

<body>

    <section class="heroTable">
        <h4>Você está logando como?</h4>
        <p>Algumas ações podem estar indisponiveis dependendo da sua escolha de login.</p>
        <div class="tableButton">
            <button class="btnADM">
                <div class="backgroundActive" ></div>
                <div class="backgroundADM"></div>
                <div class="overlayADM"></div>
                <h5>Administrador</h5>
                <p>Membros da equipe</p>
            </button>
            <button class="btnCLIENT">
                <div class="backgroundActive" ></div>
                <div class="backgroundCLIENT"></div>
                <div class="overlayCLIENT"></div>
                <div class="backgroundInitial"></div>
                <div class="backgroundFinal"></div>
                <h5>Cliente</h5>
                <p>Descontos constantes</p>
            </button>
        </div>
    </section>

</body>

</html>
