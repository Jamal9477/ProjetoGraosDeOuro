<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="pagamento_style.css">
</head>

<body>


    <nav class="menuLateral">
        <div>
            <a href="index.html"><i class="bi bi-house"></i></a>
            <a href="REDIRECIONAMENTOS/Login/Login.html"><i class="bi bi-person-circle"></i></a>
            <a href="REDIRECIONAMENTOS/Delivery/Delivery.html"><i class="bi bi-car-front-fill"></i></a>
            <a href=""><i class="bi bi-arrow-return-left"></i></a>
        </div>
    </nav>

    <main class="menuPrincipal">
        <section class="menuFormaDePagamento">
            <div class="formaDePagamento">
                <button id="btn1">cartão de credito</button>
                <div id="barra"></div>
                <button id="btn2">pix</button>
                <div id="barra2"></div>
                <button id="btn3">boleto</button>
            </div>
        </section>

        <section class="menuPago">
            <div>
                <h1 style="margin-top: 150px; margin-left: 80px;">pagamento</h1>
                <div class="menuDinheiro">
                    <h3 style="margin-top: 40px; margin-left: 80px;">GERAR QR CODE</h3>
                    <i class="bi bi-arrow-right"></i>

                    <button style="margin-left: 70px;" class="qr-button" onclick="toggleModal(true)">
                        <svg class="qr-icon" viewBox="0 0 24 24">
                            <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm0 8h2v2H5v-2zm4-4H3v6h6V9zm4-6h6v6h-6V3zm2 2v2h2V5h-2zm-2 14h2v2h-2v-2zm4-4h2v2h-2v-2zm0-4h2v2h-2v-2zm2 8h2v2h-2v-2zm-2-4h2v2h-2v-2zm-4-4h2v2h-2v-2zm2-4h2v2h-2V5zm-2 4h2v2h-2V9zm4 4h2v2h-2v-2zM3 15h6v6H3v-6zm2 2v2h2V17H5z"/>
                        </svg>
                        Gerar QR Code
                    </button>
            
                    <div class="modal-overlay" id="qrModal" onclick="toggleModal(false)">
                        <div class="modal-content" onclick="event.stopPropagation()">
                            <button class="close-button" onclick="toggleModal(false)">&times;</button>
                            <h3 style="font-family: Arial, sans-serif; margin-top: 0; color: #333;">Seu QR Code</h3>
                            

                            <img src="assets/https_www_youtube_com_watch_v_dQw4w9WgXcQ.png" alt="QR Code">
                            
                            <a href="https://qrco.de" target="_blank" style="font-family: Arial, sans-serif; color: #2563eb; text-decoration: none; font-size: 14px;">Acessar link direto</a>
                        </div>
                    </div>
                </div>
                <div class="menuCompra">
                    <h2 style="margin-left: 145px;">valor</h2>
                    <h1 style="margin-top: 40px; margin-left: -80px;">R$45,23</h1>
                </div>
            </div>
        </section>

        <section class="menuPreco">
            <div class="preco">
                <h3 style="margin-top: 20px; margin-left: 5px;">dinheiro a pagar</h3>
                <input id="input" type="text" placeholder="R$:000,000">
            </div>
        </section>
        <section class="btnCompra">
            <div>
                <button id="btnPagar"> <i class="bi bi-credit-card"></i> pagamento</button>
            </div>
        </section>
    </main>


    <script>
        function toggleModal(show) {
            const modal = document.getElementById('qrModal');
            modal.style.display = show ? 'flex' : 'none';
        }
    </script>

</body>

</html>
