<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafeterias em São Paulo</title>
<style>
:root{--brown:#46598d;--cream:#FBF6F1;--ink:#2B1B12;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--cream)}
header{background:var(--brown);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;background:#fff;border-radius:50%}
header h1{font-size:1.2rem;margin:0}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
#wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#pins{position:absolute;inset:0}
.pin{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.pin img{width:100%;height:100%;display:block}
.pin:focus-visible{outline:3px solid var(--brown);outline-offset:2px;border-radius:50%}
#zoom{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:40px;height:40px;border:0;border-radius:6px;background:#fff;color:var(--brown);font-size:1.4rem;font-weight:700;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#card{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(340px,calc(100% - 24px));background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:6;display:none}
#card h2{margin:0 24px 4px 0;font-size:1rem;color:var(--brown)}
#card p{margin:2px 0;font-size:.85rem}
#card a{color:var(--brown);font-weight:700}
#close{position:absolute;top:6px;right:8px;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--ink)}
</style>
</head>

const center={lat:(Math.min(...lats)+Math.max(...lats))/2,lng:(Math.min(...lngs)+Math.max(...lngs))/2};
let z=14,loadedZ=null;
function proj(lat,lng,zoom){const w=256*Math.pow(2,zoom);const s=Math.sin(lat*Math.PI/180);return{x:(lng+180)/360*w,y:(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*w};}
function fit(){const W=wrap.clientWidth,H=wrap.clientHeight;for(let t=17;t>=10;t--){const c=proj(center.lat,center.lng,t);const ok=places.every(p=>{const q=proj(p[2],p[3],t);return Math.abs(q.x-c.x)<W/2-60&&Math.abs(q.y-c.y)<H/2-60;});if(ok)return t;}return 10;}
const btns=places.map((p,i)=>{const b=document.createElement('button');b.className='pin';b.title=p[0];b.setAttribute('aria-label',p[0]);b.innerHTML='<img src="'+PIN+'" alt="">';b.addEventListener('click',()=>show(p));pins.appendChild(b);return b;});
function place(){const W=wrap.clientWidth,H=wrap.clientHeight,c=proj(center.lat,center.lng,z);places.forEach((p,i)=>{const q=proj(p[2],p[3],z);btns[i].style.left=(W/2+q.x-c.x)+'px';btns[i].style.top=(H/2+q.y-c.y)+'px';});}
function render(){if(loadedZ!==z){gm.src='https://www.google.com/maps?ll='+center.lat+','+center.lng+'&z='+z+'&hl=pt-BR&output=embed';loadedZ=z;}place();}
function show(p){document.getElementById('cn').textContent=p[0];document.getElementById('ca').textContent=p[1];document.getElementById('cr').textContent='Nota '+String(p[4]).replace('.',',');document.getElementById('ch').textContent=p[5];document.getElementById('cl').href=p[6];card.style.display='block';}
document.getElementById('close').addEventListener('click',()=>{card.style.display='none';});
document.getElementById('zin').addEventListener('click',()=>{z=Math.min(18,z+1);render();});
document.getElementById('zout').addEventListener('click',()=>{z=Math.max(10,z-1);render();});
window.addEventListener('resize',()=>{z=fit();render();});
z=fit();render();
</script>
