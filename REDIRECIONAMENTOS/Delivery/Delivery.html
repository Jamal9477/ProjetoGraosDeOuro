<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grãos de Ouro – Delivery</title>
<style>
:root{--bg:#0a1a33;--bg2:#10264a;--card:#142e57;--line:#27457a;--text:#eef2fa;--mute:#a9b8d4;--gold:#d9a95a;--gold2:#f0c981;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% -10%,#17376a 0,var(--bg) 55%) fixed;color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header .brand{display:flex;align-items:center;gap:12px;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}
header img{width:52px;height:52px;border-radius:50%}
header a{color:var(--text);text-decoration:none;border:1px solid var(--gold);padding:8px 16px;border-radius:99px;font:600 .9rem system-ui,sans-serif}
header a:hover{background:var(--gold);color:var(--bg)}
.hero{text-align:center;padding:36px 0 48px}
.hero img{width:min(240px,60vw);border-radius:50%;box-shadow:0 0 0 6px var(--bg2),0 0 0 7px var(--gold),0 20px 50px rgba(0,0,0,.5)}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:28px 0 8px;font-weight:400;color:var(--gold2)}
.hero p{color:var(--mute);max-width:520px;margin:0 auto;font-size:1.1rem}
section{margin-bottom:44px}
h2{font-weight:400;font-size:1.6rem;margin:0 0 18px;color:var(--gold2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
form{display:grid;gap:14px;font-family:system-ui,sans-serif}
label{font-size:.9rem;color:var(--mute);display:grid;gap:6px}
input,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit;font-size:1rem;width:100%}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
textarea{min-height:110px;resize:vertical}
.btn{background:var(--gold);color:var(--bg);border:0;border-radius:99px;padding:13px 26px;font:700 1rem system-ui,sans-serif;cursor:pointer;justify-self:start}
.btn:hover{background:var(--gold2)}
.err{color:#ff9d9d;font-size:.9rem;min-height:1.2em}
footer{text-align:center;color:var(--mute);padding:30px 0 40px;border-top:1px solid var(--line);font:.9rem system-ui,sans-serif}
header nav{display:flex;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px;font:.85rem system-ui,sans-serif}
.chips span{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--mute)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tabs button{flex:none;background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:8px 18px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.mlist{display:grid;gap:10px}
.prod{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-family:system-ui,sans-serif}
.prod .em{font-size:1.9rem;width:56px;height:56px;display:grid;place-items:center;background:var(--bg);border-radius:14px}
.prod b{font:600 1rem Georgia,serif;display:block}.prod small{color:var(--mute)}
.price{color:var(--gold2);font-weight:700;display:block;margin-top:2px}
.add{background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:7px 16px;font:600 .85rem system-ui,sans-serif;cursor:pointer}
.add:hover{background:var(--gold);color:var(--bg)}
.step{display:flex;align-items:center;gap:10px;font-weight:700}
.step button,.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);cursor:pointer;font-size:1rem}
.cart{position:sticky;top:12px;font-family:system-ui,sans-serif}
.cart h3{margin:0 0 12px;font:400 1.3rem Georgia,serif;color:var(--gold2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:99px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--mute);padding:9px;border-radius:99px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--bg)}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.qty{display:flex;align-items:center;gap:8px}
.tot{display:grid;gap:4px;margin:12px 0;color:var(--mute);font-size:.92rem}
.tot div{display:flex;justify-content:space-between}.tot .t{color:var(--text);font-weight:700;font-size:1.1rem}
.empty{color:var(--mute);padding:10px 0}
select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit;width:100%}
.ok{text-align:center}.ok .em{font-size:2.6rem}
.trk{display:grid;gap:14px;margin:18px auto;width:max-content;max-width:100%;text-align:left}
.trk div{display:flex;gap:12px;align-items:center;color:var(--mute)}
.trk i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.trk .d{color:var(--text)}.trk .d i{background:var(--gold);border-color:var(--gold)}
.fab{display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:520px;margin:0 auto;justify-content:center;background:var(--gold);color:var(--bg);border:0;border-radius:99px;padding:15px;font:700 1rem system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}.cart{position:static}.fab.show{display:flex}}
</style>
</head>

  <h1>Café fresquinho na sua porta</h1>
  <p>Escolha seus favoritos do cardápio e receba a Grãos de Ouro direto em casa.</p>
</div>

<section id="delivery">
  <h2>Peça em casa</h2>
  <div class="chips"><span>⏱ 35–45 min</span><span>🛵 Entrega R$ 6,00 · grátis acima de R$ 60</span><span>🏪 Retirada grátis</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="dgrid">
    <div class="mlist" id="menu"></div>
    <div class="panel cart" id="cart"></div>
  </div>
</section>

<footer>☕ Grãos de Ouro · Obrigado por escolher o nosso café</footer>
</div>

<button class="fab" id="fab"></button>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== Delivery ===== */
const cats=["Cafés","Salgados","Doces","Gelados"];
const menu=[
 {id:1,c:"Cafés",e:"☕",n:"Espresso",d:"Intenso, grãos selecionados",p:7},
 {id:2,c:"Cafés",e:"🥛",n:"Cappuccino",d:"Cremoso com espuma de leite",p:12},
 {id:3,c:"Cafés",e:"🫖",n:"Café coado",d:"Preparo na hora, 300 ml",p:6.5},
 {id:4,c:"Cafés",e:"🍯",n:"Latte caramelo",d:"Doce na medida certa",p:14},
 {id:5,c:"Salgados",e:"🧀",n:"Pão de queijo",d:"Porção com 6 unidades",p:11},
 {id:6,c:"Salgados",e:"🥐",n:"Croissant de queijo",d:"Folhado e quentinho",p:13},
 {id:7,c:"Salgados",e:"🥪",n:"Misto quente",d:"Pão na chapa, queijo e presunto",p:15},
 {id:8,c:"Doces",e:"🍰",n:"Bolo de fubá",d:"Fatia caseira",p:9},
 {id:9,c:"Doces",e:"🍫",n:"Brownie",d:"Com calda de chocolate",p:10},
 {id:10,c:"Doces",e:"🍪",n:"Cookie de chocolate",d:"Crocante por fora, macio por dentro",p:8},
 {id:11,c:"Gelados",e:"🧊",n:"Cold brew",d:"Café coado a frio, 300 ml",p:13},
 {id:12,c:"Gelados",e:"🥤",n:"Frappé de café",d:"Gelado e cremoso, 400 ml",p:16}
];
let cart={},cat=cats[0],mode="entrega",done=null,timer=null;
const f={n:"",p:"",a:"",y:"Pix",o:""};
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const stepNames=()=>["Pedido recebido","Preparando seu café",done.mode==="entrega"?"Saiu para entrega":"Pronto para retirada",done.mode==="entrega"?"Entregue":"Retirado"];
function totals(){const ids=Object.keys(cart);const sub=ids.reduce((a,i)=>a+menu.find(m=>m.id==i).p*cart[i],0);const fee=mode==="entrega"&&sub>0&&sub<60?6:0;return{ids,sub,fee,total:sub+fee,n:ids.reduce((a,i)=>a+cart[i],0)}}
function drawMenu(){
  $("tabs").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-cat="${c}">${c}</button>`).join("");
  $("menu").innerHTML=menu.filter(m=>m.c===cat).map(m=>{const q=cart[m.id]||0;
    const act=q?`<div class="step"><button data-dec="${m.id}" aria-label="Diminuir">−</button>${q}<button data-inc="${m.id}" aria-label="Aumentar">+</button></div>`:`<button class="add" data-add="${m.id}">Adicionar</button>`;
    return `<div class="prod"><div class="em">${m.e}</div><div><b>${m.n}</b><small>${m.d}</small><span class="price">${brl(m.p)}</span></div>${act}</div>`}).join("");
}
function drawCart(){
  const el=$("cart"),T=totals(),fab=$("fab");
  fab.classList.toggle("show",T.n>0&&!done);
  fab.textContent=`🛒 Ver pedido · ${T.n} ${T.n===1?"item":"itens"} · ${brl(T.total)}`;
  if(done){
    el.innerHTML=`<div class="ok"><div class="em">✅</div><h3>Pedido #${done.num} confirmado!</h3><p style="color:var(--mute);margin:0">Obrigado, ${esc(done.name)}. Total ${brl(done.total)}.</p><div class="trk">${stepNames().map((s,i)=>`<div class="${i<=done.step?"d":""}"><i></i>${s}</div>`).join("")}</div><button class="btn" id="again">Fazer novo pedido</button></div>`;return}
  let h=`<h3>Seu pedido</h3><div class="seg"><button data-mode="entrega" class="${mode==="entrega"?"on":""}">🛵 Entrega</button><button data-mode="retirada" class="${mode==="retirada"?"on":""}">🏪 Retirada</button></div>`;
  if(!T.n){el.innerHTML=h+`<div class="empty">Seu carrinho está vazio. Escolha algo do cardápio.</div>`;return}
  h+=T.ids.map(i=>{const m=menu.find(x=>x.id==i);return `<div class="cl"><span>${m.n}</span><span class="qty"><button data-dec="${i}" aria-label="Diminuir">−</button>${cart[i]}<button data-inc="${i}" aria-label="Aumentar">+</button></span><span>${brl(m.p*cart[i])}</span></div>`}).join("");
  h+=`<div class="tot"><div><span>Subtotal</span><span>${brl(T.sub)}</span></div><div><span>${mode==="entrega"?"Entrega":"Retirada"}</span><span>${T.fee?brl(T.fee):"Grátis"}</span></div><div class="t"><span>Total</span><span>${brl(T.total)}</span></div></div>`;
  const addr=mode==="entrega"?`<label>Endereço de entrega<input data-f="a" maxlength="120" placeholder="Rua, número, bairro" value="${esc(f.a)}"></label>`:`<p style="margin:0;color:var(--mute);font-size:.9rem">Retire no balcão da Grãos de Ouro.</p>`;
  const pay=["Pix","Cartão","Dinheiro"].map(o=>`<option ${f.y===o?"selected":""}>${o}</option>`).join("");
  h+=`<form id="co" novalidate><label>Nome<input data-f="n" maxlength="40" value="${esc(f.n)}"></label><label>Telefone<input data-f="p" type="tel" maxlength="20" placeholder="(11) 90000-0000" value="${esc(f.p)}"></label>${addr}<label>Pagamento<select data-f="y">${pay}</select></label><label>Observações<input data-f="o" maxlength="80" placeholder="Ex.: sem açúcar" value="${esc(f.o)}"></label><div class="err" id="cerr" role="alert"></div><button class="btn" type="submit" style="justify-self:stretch">Finalizar · ${brl(T.total)}</button></form>`;
  el.innerHTML=h;
}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.f;if(k)f[k]=e.target.value});
document.addEventListener("submit",e=>{
  if(e.target.id!=="co")return;
  e.preventDefault();
  if(!f.n.trim()||f.p.replace(/\D/g,"").length<10||(mode==="entrega"&&!f.a.trim())){$("cerr").textContent=mode==="entrega"?"Informe nome, telefone com DDD e endereço.":"Informe nome e telefone com DDD.";return}
  const T=totals();
  done={num:Math.floor(1000+Math.random()*9000),name:f.n.trim(),total:T.total,mode,step:0};
  cart={};f.o="";
  clearInterval(timer);
  timer=setInterval(()=>{if(!done||done.step>=3){clearInterval(timer);return}done.step++;drawCart()},4000);
  drawMenu();drawCart();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.cat){cat=d.cat;drawMenu();return}
  if(d.mode){mode=d.mode;drawCart();return}
  if(d.add){cart[d.add]=1}
  else if(d.inc){cart[d.inc]++}
  else if(d.dec){if(--cart[d.dec]<=0)delete cart[d.dec]}
  else if(t.id==="again"){done=null;clearInterval(timer);drawCart();return}
  else if(t.id==="fab"){$("cart").scrollIntoView({behavior:"smooth"});return}
  else return;
  drawMenu();drawCart();
});
drawMenu();drawCart();
</script>
</body>
</html>
